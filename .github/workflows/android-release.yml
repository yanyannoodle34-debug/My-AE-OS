name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env file exists for secrets plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Decode debug keystore if base64 file exists
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-android-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: AetherOS Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 AetherOS AI Kernel Android Release
            
            ### ✨ Features Included
            - **AI Director Agent**: Autonomous photo (1:1) and Reels (9:16) creation with toggle switch.
            - **Facebook Reels Engine**: Meta policy-compliant 9:16 vertical video support (1080x1920).
            - **500MB Video Splitter**: Auto-chunking large video uploads into max 60s Reel segments.
            - **Multi-Agent Orchestration**: 7 kernel worker nodes with customizable LLM provider matrix.
            - **Facebook Graph API v22 Integration**: Meta Page publishing & token sandbox.

            ---
            *Automated build & APK release generated by GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

