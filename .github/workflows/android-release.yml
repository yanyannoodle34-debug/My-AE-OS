name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Prepare Environment & Keystore
        run: |
          # Create placeholder .env file so secrets gradle plugin passes without requiring CI secrets.
          # API keys are configured directly inside the app by the user.
          echo "GEMINI_API_KEY=PLACEHOLDER_KEY" > .env
          echo "NVIDIA_API_KEY=PLACEHOLDER_KEY" >> .env
          echo "OPENROUTER_API_KEY=PLACEHOLDER_KEY" >> .env

          # Setup debug keystore if not present
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore || openssl base64 -d -in debug.keystore.base64 -out debug.keystore || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Sync to default user android folder just in case
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-android-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('AetherOS Release {0}', github.ref_name) || format('AetherOS Build ({0})', github.sha) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('release-{0}', github.sha) }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 AetherOS AI Kernel Android Release
            
            ### ✨ Features Included
            - **AI Director Agent**: Autonomous photo (1:1) and Reels (9:16) creation with toggle switch.
            - **Facebook Reels Engine**: Meta policy-compliant 9:16 vertical video support (1080x1920).
            - **500MB Video Splitter**: Auto-chunking large video uploads into max 60s Reel segments.
            - **Multi-Agent Orchestration**: 7 kernel worker nodes with customizable LLM provider matrix.
            - **Facebook Graph API v22 Integration**: Meta Page publishing & token sandbox.

            ---
            *Automated build & APK release generated by GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


