name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env file exists for secrets plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Setup debug keystore if not present
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > ~/.android/debug.keystore || base64 -d debug.keystore.base64 > ~/.android/debug.keystore || true
            cp ~/.android/debug.keystore ./debug.keystore || true
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ./debug.keystore || true
          fi

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-android-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: AetherOS Release (${{ github.sha }})
          tag_name: release-${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 AetherOS AI Kernel Android Release
            
            ### ✨ Features Included
            - **AI Director Agent**: Autonomous photo (1:1) and Reels (9:16) creation with toggle switch.
            - **Facebook Reels Engine**: Meta policy-compliant 9:16 vertical video support (1080x1920).
            - **500MB Video Splitter**: Auto-chunking large video uploads into max 60s Reel segments.
            - **Multi-Agent Orchestration**: 7 kernel worker nodes with customizable LLM provider matrix.
            - **Facebook Graph API v22 Integration**: Meta Page publishing & token sandbox.

            ---
            *Automated build & APK release generated by GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


