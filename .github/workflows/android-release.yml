name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleUnsignedRelease --stacktrace || ./gradlew assembleDebug

      - name: Find Built APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-android-apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: AetherOS Release ${{ github.ref_name }}
          body: |
            ## 🚀 AetherOS AI Kernel Release
            
            ### ✨ Included Features
            - **AI Director Agent**: Autonomous photo (1:1) and Reels (9:16) creation with ON/OFF switch.
            - **Facebook Reels Engine**: Meta policy compliant 9:16 vertical video support (1080x1920).
            - **500MB Video Splitter**: Auto-chunking large video uploads into max 60s Reel segments.
            - **Multi-Agent Orchestration**: 7 kernel worker nodes with custom LLM provider matrix.
            - **Facebook Graph API v22 Integration**: Page publishing, token management, and live sandbox.

            ---
            *Automated build & release generated by GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
